[package]
name = "wasm-superopt"
description = "Deobfuscator and superoptimizer for WebAssembly: lifts to SSA, proves simplifications, and lowers back"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "wasm-superopt"
path = "src/main.rs"

[dependencies]
wasm-encoder = { version = "0.263", features = ["wasmparser"] }
wasmparser = "0.263"

[dev-dependencies]
wasmtime = "48"
wat = "1"
