name: Release Rust Tools

on:
  push:
    tags:
      - "v*.0.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    name: Create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest --verify-tag

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: create
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --release --locked --workspace
        working-directory: rust
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          for tool in wasm-superopt absint; do
            cp "rust/target/release/$tool${{ matrix.ext }}" "dist/$tool-$GITHUB_REF_NAME-${{ matrix.target }}${{ matrix.ext }}"
          done
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for f in *; do
            # Windows runners have sha256sum, and macOS runners have shasum.
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            gh release upload "$GITHUB_REF_NAME" "$f" "$f.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          done
